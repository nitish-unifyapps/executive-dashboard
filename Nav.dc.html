<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    a { color: inherit; }
    ::selection { background: #BFE0FF; }
  </style>
</helmet>
<div style="background:#003045;position:relative;z-index:100;" onClick="{{stop}}">
  <div style="max-width:1440px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:36px;min-width:0;">
      <a href="Executive-Intelligence.dc.html" aria-label="Shaw home" style="display:flex;align-items:center;text-decoration:none;flex-shrink:0;">
        <img src="./productImages/Shaw-logo.jpg" alt="Shaw" style="display:block;width:118px;height:26px;object-fit:contain;">
      </a>
      <div style="display:flex;align-items:center;gap:26px;overflow:hidden;min-width:0;">
        <sc-for list="{{navLinks}}" as="link" hint-placeholder-count="5">
          <a href="{{link.href}}" style="{{link.style}}">{{link.label}}</a>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;position:relative;flex-shrink:0;">
      <div style="position:relative;flex-shrink:0;">
        <button onClick="{{toggleMonth}}" style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #fff;color:#003045;font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,0.12);cursor:pointer;white-space:nowrap;">
          {{month}}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <sc-if value="{{monthOpen}}" hint-placeholder-val="{{false}}">
          <div style="position:absolute;top:44px;right:0;background:#fff;border:1px solid #E4E7EC;border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,0.12);padding:6px;width:140px;z-index:200;">
            <sc-for list="{{months}}" as="m" hint-placeholder-count="3">
              <div onClick="{{m.select}}" style="{{m.style}}">{{m.label}}</div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="position:relative;flex-shrink:0;">
        <button onClick="{{toggleAvatar}}" style="width:32px;height:32px;border-radius:999px;background:#16495B;border:1px solid #3B6574;color:#F3F7F8;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;">JD</button>
        <sc-if value="{{avatarOpen}}" hint-placeholder-val="{{false}}">
          <div style="position:absolute;top:40px;right:0;background:#fff;border:1px solid #E4E7EC;border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,0.12);padding:6px;width:150px;z-index:200;">
            <div style="padding:8px 10px;font-size:13px;color:#101828;border-radius:6px;cursor:pointer;">Profile</div>
            <div style="padding:8px 10px;font-size:13px;color:#101828;border-radius:6px;cursor:pointer;">Settings</div>
            <div style="height:1px;background:#EEF1F4;margin:4px 0;"></div>
            <div style="padding:8px 10px;font-size:13px;color:#101828;border-radius:6px;cursor:pointer;">Log out</div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activePage&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;exec&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { filtersOpen: false, monthOpen: false, avatarOpen: false, month: 'June 2026' };

  renderVals() {
    const active = this.props.activePage;
    const pages = [
      { key: 'exec', label: 'Executive Intelligence', href: 'Executive-Intelligence.dc.html' },
      { key: 'market', label: 'Market Insights', href: 'Market-Insights.dc.html' },
      { key: 'product', label: 'Product and Competitor Intel', href: 'Product-Competitor-Intel.dc.html' },
      { key: 'strategic', label: 'Strategic Priorities', href: 'Strategic-Priorities.dc.html' },
      { key: 'alerts', label: 'Alerts and Risks', href: 'Alerts-Risks.dc.html' },
    ];
    const navLinks = pages.map(p => ({
      label: p.label,
      href: p.href,
      style: `display:inline-flex;align-items:center;height:56px;box-sizing:border-box;color:${p.key === active ? '#fff' : '#B8CCD4'};text-decoration:none;font-size:14px;font-weight:500;border-bottom:2px solid ${p.key === active ? '#fff' : 'transparent'};white-space:nowrap;flex-shrink:0;`,
    }));
    const months = ['April 2026', 'May 2026', 'June 2026'].map(m => ({
      label: m,
      style: `padding:8px 10px;font-size:13px;font-weight:${m === this.state.month ? '700' : '400'};border-radius:6px;cursor:pointer;color:${m === this.state.month ? '#003045' : '#101828'};background:${m === this.state.month ? '#E8F2F5' : 'transparent'};`,
      select: () => this.setState({ month: m, monthOpen: false }),
    }));
    return {
      navLinks,
      months,
      month: this.state.month,
      monthOpen: this.state.monthOpen,
      avatarOpen: this.state.avatarOpen,
      toggleMonth: () => this.setState(s => ({ monthOpen: !s.monthOpen, avatarOpen: false })),
      toggleAvatar: () => this.setState(s => ({ avatarOpen: !s.avatarOpen, monthOpen: false })),
    };
  }
}
</script>
</body>
</html>
